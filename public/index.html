<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#00f5a0" />
<title>Will's AI</title>
<link rel="icon" href="/icons/icon-192.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/styles.css" />
<style>
  /* Signal UI Styles */
  .signal-wrapper { display: flex; flex-direction: column; height: calc(100vh - 120px); max-width: 800px; margin: 0 auto; position: relative; }
  
  /* Back Button */
  .btn-back { position: absolute; top: 15px; left: 15px; background: var(--bg3); border: 1px solid var(--border); color: var(--text); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; font-size: 18px; }
  
  /* Orb Area */
  .orb-area { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 20px; flex-shrink: 0; transition: 0.3s ease; }
  .orb-area.shrink { padding: 10px 20px; }
  .orb-wrapper { position: relative; width: 140px; height: 140px; margin-bottom: 15px; transition: 0.3s ease; }
  .orb-area.shrink .orb-wrapper { width: 80px; height: 80px; margin-bottom: 5px; }
  .orb-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); animation: pulse-ring 2s infinite ease-out; }
  .orb-ring:nth-child(2) { animation-delay: 0.5s; }
  .orb-ring:nth-child(3) { animation-delay: 1s; }
  .orb-svg { position: absolute; inset: 12px; border-radius: 50%; background: var(--bg2); display: flex; align-items: center; justify-content: center; z-index: 2; box-shadow: 0 0 30px rgba(0, 245, 160, 0.3); }
  .orb-svg svg { width: 60%; height: 60%; }
  @keyframes pulse-ring { 0% { transform: scale(0.8); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }
  
  .signal-title { font-size: 22px; font-weight: 800; background: linear-gradient(135deg, var(--accent), #00d4ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; transition: 0.3s ease; }
  .orb-area.shrink .signal-title { font-size: 16px; }
  .signal-sub { font-size: 13px; color: var(--text-dim); transition: 0.3s ease; }
  .orb-area.shrink .signal-sub { display: none; }

  /* Chat Area */
  .signal-chat { flex: 1; display: flex; flex-direction: column; background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin: 0 15px 15px; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 90%; padding: 12px 16px; border-radius: 12px; font-size: 13px; line-height: 1.5; animation: slide 0.2s ease; }
  .msg.user { align-self: flex-end; background: var(--accent); color: var(--bg); border-bottom-right-radius: 4px; font-weight: 500; }
  .msg.bot { align-self: flex-start; background: var(--bg3); border: 1px solid var(--border); color: var(--text); border-bottom-left-radius: 4px; }
  @keyframes slide { from { opacity: 0; transform: translateY(5px); } }
  
  .msg.bot strong { color: var(--accent); }
  .msg.bot .signal-buy { color: var(--beat); font-weight: 800; }
  .msg.bot .signal-sell { color: var(--miss); font-weight: 800; }
  
  /* Quick Buttons */
  .quick-symbols { display: flex; gap: 6px; padding: 10px 15px; overflow-x: auto; background: var(--bg); border-top: 1px solid var(--border); }
  .quick-symbols::-webkit-scrollbar { height: 0; }
  .quick-symbols button { padding: 6px 12px; background: var(--bg3); border: 1px solid var(--border); color: var(--text-dim); border-radius: 20px; font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 4px; }
  .quick-symbols button:hover { border-color: var(--accent); color: var(--text); }

  /* Input Area */
  .chat-input-area { display: flex; align-items: center; gap: 8px; padding: 10px 15px; background: var(--bg); border-top: 1px solid var(--border); }
  .chat-input-area textarea { flex: 1; padding: 10px 14px; background: var(--bg3); border: 1px solid var(--border); border-radius: 20px; color: var(--text); font-family: inherit; font-size: 13px; resize: none; min-height: 40px; max-height: 80px; }
  .chat-input-area textarea:focus { outline: none; border-color: var(--accent); }
  
  /* Small Timeframe Select */
  .tf-select-small { padding: 8px 10px; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 11px; font-weight: 600; font-family: inherit; cursor: pointer; }
  
  .btn-send { padding: 0 16px; height: 40px; background: var(--accent); border: none; border-radius: 20px; color: var(--bg); font-weight: 700; font-size: 13px; cursor: pointer; }
  .btn-send:disabled { opacity: 0.5; }

  /* Typing Indicator */
  .typing { display: none; align-self: flex-start; background: var(--bg3); padding: 12px 16px; border-radius: 12px; color: var(--accent); font-size: 12px; font-weight: 600; font-style: italic; }
  .typing.show { display: block; animation: slide 0.2s ease; }
</style>
</head>
<body data-theme="dark">

<!-- PWA Banner & Top Bar (Keep existing) -->
<div class="pwa-banner" id="pwaBanner">
  <div class="pwa-inner">
    <div class="pwa-icon">◆</div>
    <div class="pwa-text"><strong>Install Will's AI</strong><span>Faster access, offline support</span></div>
    <button class="pwa-install" id="pwaInstall">Install</button>
    <button class="pwa-dismiss" id="pwaDismiss">✕</button>
  </div>
</div>

<div class="top">
  <div class="brand">Will's AI</div>
  <div class="header-right">
    <div class="theme-switch">
      <div class="theme-btn dark active" data-theme="dark" title="Dark"></div>
      <div class="theme-btn light" data-theme="light" title="Light"></div>
      <div class="theme-btn ocean" data-theme="ocean" title="Ocean"></div>
      <div class="theme-btn sunset" data-theme="sunset" title="Sunset"></div>
    </div>
    <div id="authArea"></div>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="calendar">📅 Calendar</button>
  <button class="tab-btn" data-tab="news">📰 News</button>
  <button class="tab-btn" data-tab="signal">🧠 Signal AI</button>
  <span class="last-updated" id="lastUpdated">—</span>
</div>

<!-- Calendar & News Panels (Keep existing) -->
<!-- ... -->
<div class="panel" id="panel-calendar"><!-- existing calendar code --></div>
<div class="panel" id="panel-news"><!-- existing news code --></div>

<!-- NEW: Signal Generator Panel -->
<div class="panel" id="panel-signal">
  <div class="signal-wrapper">
    <button class="btn-back" id="signalBackBtn">←</button>
    
    <div class="orb-area" id="orbArea">
      <div class="orb-wrapper">
        <div class="orb-ring"></div>
        <div class="orb-ring"></div>
        <div class="orb-ring"></div>
        <div class="orb-svg">
          <svg viewBox="0 0 192 192"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00f5a0"/><stop offset="100%" stop-color="#00d4ff"/></linearGradient></defs><text x="96" y="130" font-family="sans-serif" font-size="120" font-weight="800" fill="url(#g)" text-anchor="middle">W</text></svg>
        </div>
      </div>
      <h2 class="signal-title">Will's AI Signal</h2>
      <p class="signal-sub">Making sure AI works for your family</p>
    </div>

    <div class="signal-chat">
      <div class="chat-messages" id="signalChatMessages">
        <!-- Welcome message -->
        <div class="msg bot">Hello! Select a symbol below or type a message to get a market signal.</div>
        <div class="typing" id="signalTyping">Analyzing market data...</div>
      </div>
      
      <div class="quick-symbols">
        <button data-sym="XAUUSD">🥇 Gold</button>
        <button data-sym="EURUSD">💶 EUR/USD</button>
        <button data-sym="BTCUSD">₿ Bitcoin</button>
        <button data-sym="GBPUSD">🇬🇧 GBP/USD</button>
        <button data-sym="XAGUSD">🥈 Silver</button>
      </div>

      <div class="chat-input-area">
        <select id="signalTF" class="tf-select-small">
          <option value="1m">1m</option>
          <option value="5m">5m</option>
          <option value="15m">15m</option>
          <option value="1h" selected>1h</option>
          <option value="4h">4h</option>
          <option value="1d">1d</option>
        </select>
        <textarea id="signalInput" rows="1" placeholder="Type a message or select a symbol..."></textarea>
        <button class="btn-send" id="signalSendBtn">Send</button>
      </div>
    </div>
  </div>
</div>

<!-- Auth & Pref Panels (Keep existing) -->
<!-- ... -->
<script src="/auth-client.js"></script>
<script src="/app.js"></script>
</body>
</html>
