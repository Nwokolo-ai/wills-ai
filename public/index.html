<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#00f5a0" />
<title>Will's AI</title>
<link rel="icon" href="/icons/icon-192.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/styles.css" />
<style>
  /* DeepSeek / Signal UI Styles */
  .signal-container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; padding: 20px; text-align: center; }
  .orb-wrapper { position: relative; width: 180px; height: 180px; margin-bottom: 20px; }
  .orb-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); animation: pulse-ring 2s infinite ease-out; }
  .orb-ring:nth-child(2) { animation-delay: 0.5s; }
  .orb-ring:nth-child(3) { animation-delay: 1s; }
  .orb-svg { position: absolute; inset: 15px; border-radius: 50%; background: var(--bg2); display: flex; align-items: center; justify-content: center; z-index: 2; box-shadow: 0 0 30px rgba(0, 245, 160, 0.3); }
  .orb-svg svg { width: 80px; height: 80px; }
  @keyframes pulse-ring {
    0% { transform: scale(0.8); opacity: 1; }
    100% { transform: scale(1.4); opacity: 0; }
  }
  .signal-title { font-size: 24px; font-weight: 800; background: linear-gradient(135deg, var(--accent), #00d4ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; }
  .signal-sub { font-size: 14px; color: var(--text-dim); margin-bottom: 30px; }
  .signal-controls { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
  .signal-controls select { padding: 12px; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px; font-family: inherit; }
  .signal-btn { padding: 14px; background: linear-gradient(135deg, var(--accent), #00d4ff); color: var(--bg); border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.2s; }
  .signal-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .signal-result { margin-top: 20px; padding: 20px; background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; text-align: left; max-width: 500px; width: 100%; white-space: pre-wrap; display: none; line-height: 1.5; font-size: 14px;}
  .signal-result.show { display: block; }
</style>
</head>
<body data-theme="dark">

<!-- ... [Keep your existing PWA Banner and Top Bar] ... -->
<div class="top">
  <div class="brand">Will's AI</div>
  <div class="header-right">
    <div class="theme-switch">
      <div class="theme-btn dark active" data-theme="dark" title="Dark"></div>
      <div class="theme-btn light" data-theme="light" title="Light"></div>
      <div class="theme-btn ocean" data-theme="ocean" title="Ocean"></div>
      <div class="theme-btn sunset" data-theme="sunset" title="Sunset"></div>
    </div>
    <div id="authArea"></div>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="calendar">📅 Calendar</button>
  <button class="tab-btn" data-tab="news">📰 News</button>
  <button class="tab-btn" data-tab="signal">🧠 Signal AI</button>
  <span class="last-updated" id="lastUpdated">—</span>
</div>

<!-- ... [Keep your existing Calendar and News panels] ... -->

<!-- NEW: Signal Generator Panel -->
<div class="panel" id="panel-signal">
  <div class="signal-container">
    <div class="orb-wrapper">
      <div class="orb-ring"></div>
      <div class="orb-ring"></div>
      <div class="orb-ring"></div>
      <div class="orb-svg">
        <!-- Your SVG Logo -->
        <svg viewBox="0 0 192 192"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00f5a0"/><stop offset="100%" stop-color="#00d4ff"/></linearGradient></defs><text x="96" y="130" font-family="sans-serif" font-size="120" font-weight="800" fill="url(#g)" text-anchor="middle">W</text></svg>
      </div>
    </div>
    
    <h2 class="signal-title">Will's AI Signal</h2>
    <p class="signal-sub">Making sure AI works for your family</p>

    <div class="signal-controls">
      <select id="signalSymbol">
        <option value="XAUUSD">Gold (XAU/USD)</option>
        <option value="EURUSD">EUR/USD</option>
        <option value="GBPUSD">GBP/USD</option>
        <option value="BTCUSD">Bitcoin</option>
      </select>
      <select id="signalTF">
        <option value="1m">1 Minute</option>
        <option value="5m">5 Minutes</option>
        <option value="15m">15 Minutes</option>
        <option value="1h" selected>1 Hour</option>
        <option value="4h">4 Hours</option>
        <option value="1d">1 Day</option>
      </select>
      <button class="signal-btn" id="generateSignalBtn">Generate Signal</button>
    </div>
    
    <div class="signal-result" id="signalResult"></div>
  </div>
</div>

<!-- ... [Keep your Auth and Pref panels] ... -->

<script src="/auth-client.js"></script>
<script src="/app.js"></script>
</body>
</html>
